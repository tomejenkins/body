# Read-only policy tests. Never accesses OpenAI, secrets or production systems.
name: Body agent policy checks

on:
  pull_request:
    paths:
      - 'scripts/agent/**'
      - '.github/workflows/body-agent-policy-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate daily approval and pilot safeguards
        run: node --test scripts/agent/*.test.mjs
